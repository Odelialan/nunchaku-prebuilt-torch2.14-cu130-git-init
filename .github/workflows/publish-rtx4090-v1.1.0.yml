name: Publish RTX 4090 sm_89 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-rtx4090-v1.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WHEEL_NAME: nunchaku-1.3.0.dev20260914+cu13.0torch2.14-cp312-cp312-linux_x86_64.whl
      WHEEL_SHA256: b29d74fca0b6021bc80714e679c93278ce35ed57dfac657ff0bbb7d3a146ef91
      BUNDLE_NAME: nunchaku-rtx4090-sm89-torch2.14-cu130-cp312.tar.gz
      WHEEL_URL: https://huggingface.co/IrisLan/nunchaku-prebuilt-torch2.14-cu130/resolve/cbc0528025310f1b07da0141d650d27ee3707f7b/rtx4090-sm89/nunchaku-1.3.0.dev20260914%2Bcu13.0torch2.14-cp312-cp312-linux_x86_64.whl?download=true
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify the tested wheel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors -o "$WHEEL_NAME" "$WHEEL_URL"
          echo "$WHEEL_SHA256  $WHEEL_NAME" | sha256sum -c -
          tar -czf "$BUNDLE_NAME" "$WHEEL_NAME"
          sha256sum "$WHEEL_NAME" "$BUNDLE_NAME" > SHA256SUMS

      - name: Create v1.1.0 without changing v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.0 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v1.1.0 \
            "$BUNDLE_NAME#RTX 4090 sm_89 wheel bundle" \
            "SHA256SUMS#SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.1.0 — RTX 4090 sm_89" \
            --notes "RTX 4090-specific Nunchaku build for Linux x86_64, Python 3.12, PyTorch 2.14.0+cu130, and CUDA 13.0. Compiled with -gencode arch=compute_89,code=sm_89 and validated by executing awq_gemv_w4a16_cuda on a physical RTX 4090. The existing v1.0.0 RTX 5090/sm_120a release is unchanged. Extract the tar.gz before installing the contained wheel."

